<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dow Swing Chart __TITLE__</title>
<style>
  :root { --bg:#111418; --panel:#1a1f26; --fg:#d7dce2; --mut:#8b95a1; --grid:#262d36;
          --up:#2bb673; --dn:#e5534b; --sh:#f2b84b; --sl:#4aa8f2; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:13px/1.4 system-ui,"Hiragino Sans","Noto Sans JP",sans-serif; }
  body { display:flex; flex-direction:column; }
  #ctl { display:flex; flex-wrap:wrap; gap:6px 18px; align-items:center; padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--grid); }
  #ctl label { display:flex; align-items:center; gap:6px; white-space:nowrap; }
  #ctl input[type=range] { width:130px; }
  #ctl b { display:inline-block; min-width:2.4em; text-align:right; color:#fff; font-variant-numeric:tabular-nums; }
  select,button { background:#242b34; color:var(--fg); border:1px solid #38414d; border-radius:4px; padding:3px 8px; font:inherit; }
  button:hover { background:#2e3744; cursor:pointer; }
  #wrap { position:relative; flex:1; min-height:0; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; cursor:crosshair; }
  #info { position:absolute; left:10px; top:8px; pointer-events:none; background:rgba(17,20,24,.85); padding:6px 9px; border-radius:4px; font-variant-numeric:tabular-nums; white-space:pre; }
  #stat { color:var(--mut); margin-left:auto; }
  @media (max-width:700px) {
    #ctl { gap:4px 12px; padding:6px 8px; font-size:12px; }
    #ctl label:has(#n) { order:-1; flex:1 1 100%; font-size:15px; font-weight:600; }
    #ctl label:has(#n) input { flex:1; height:32px; }
    #ctl label:has(#ap), #ctl label:has(#ma) { flex:1 1 45%; }
    #ctl label:has(#ap) input, #ctl label:has(#ma) input { width:100%; flex:1; min-width:0; }
    #stat { margin-left:0; }
  }
  .sw { display:inline-block; width:10px; height:10px; border-radius:2px; vertical-align:-1px; margin-right:3px; }
</style>
</head>
<body>
<div id="ctl">
  <label>時間足 <select id="tf"><option>1H</option><option selected>4H</option><option>D1</option><option>W1</option></select></label>
  <label>ピボット幅 n <input id="n" type="range" min="1" max="20" step="1" value="3"><b id="nv"></b></label>
  <label>ATR期間 <input id="ap" type="range" min="5" max="60" step="1" value="14"><b id="apv"></b></label>
  <label>最小スイング幅(ATR×) <input id="ma" type="range" min="0" max="5" step="0.1" value="1"><b id="mav"></b></label>
  <label><input id="wick" type="checkbox" checked> ヒゲでブレイク判定</label>
  <label><input id="shade" type="checkbox" checked> トレンド背景</label>
  <label><input id="zig" type="checkbox" checked> スイング線</label>
  <label><input id="oldp" type="checkbox" checked> 置き換えられたスイングも表示</label>
  <label><input id="conf" type="checkbox"> 確定位置(n本後)を表示</label>
  <label>ジャンプ <input id="jump" type="date" min="2021-01-01" max="2025-12-31"></label>
  <button id="reset">全期間</button>
  <span id="trctl" style="display:none; gap:6px 18px; flex-wrap:wrap; align-items:center">
    <label>背景 <select id="bg"><option value="used" selected>検証で使った週足トレンド</option><option value="tf">表示中の時間足で計算</option></select></label>
    <label><input id="trd" type="checkbox" checked> トレード</label>
    <label><input id="eln" type="checkbox" checked> <span id="elnlab">エントリーライン</span></label>
    <button id="prev">◀ 前のトレード</button><button id="next">次のトレード ▶</button>
  </span>
  <span id="stat"></span>
</div>
<div id="wrap"><canvas id="cv"></canvas><div id="info"></div></div>
<script>
const DATA = __DATA__;
const TR = __TRADES__;  // null: トレード表示なし（dow_swing_chart.py --trades で埋め込む）
const UP = 1, RANGE = 0, DOWN = -1;

/* ---------- dow_trend.py の移植（同じアルゴリズム） ---------- */
function atrWilder(h, l, c, period) {
  const n = c.length, tr = new Float64Array(n), atr = new Float64Array(n).fill(NaN);
  tr[0] = h[0] - l[0];
  for (let i = 1; i < n; i++) tr[i] = Math.max(h[i] - l[i], Math.abs(h[i] - c[i-1]), Math.abs(l[i] - c[i-1]));
  if (n >= period) {
    let s = 0; for (let i = 0; i < period; i++) s += tr[i];
    atr[period-1] = s / period;
    for (let i = period; i < n; i++) atr[i] = (atr[i-1] * (period - 1) + tr[i]) / period;
  }
  return atr;
}
function computeDow(d, cfg) {
  const { o, h, l, c } = d, nb = c.length, n = cfg.n;
  const atr = atrWilder(h, l, c, cfg.atrPeriod);
  const piv = [], trend = new Int8Array(nb);
  const old = [], ush = new Array(nb).fill(null), usl = new Array(nb).fill(null); // 表示用: 置き換えられたピボットと、各足の判定に使った SH/SL
  let state = RANGE;
  for (let i = 0; i < nb; i++) {
    const j = i - n;
    if (j >= n) {
      let mh = -Infinity, ml = Infinity, ch = 0, cl = 0;
      for (let k = j - n; k <= j + n; k++) {
        if (h[k] > mh) { mh = h[k]; ch = 1 } else if (h[k] === mh) ch++;
        if (l[k] < ml) { ml = l[k]; cl = 1 } else if (l[k] === ml) cl++;
      }
      const cands = [];
      if (h[j] === mh && ch === 1) cands.push(["H", j, h[j]]);
      if (l[j] === ml && cl === 1) cands.push(["L", j, l[j]]);
      for (const [kind, idx, price] of cands) {
        const cd = { kind, bar: idx, price, conf: i };
        if (!piv.length) { piv.push(cd); continue; }
        const last = piv[piv.length - 1];
        if (last.kind === kind) {
          if ((kind === "H" && price > last.price) || (kind === "L" && price < last.price)) { old.push({ ...last, repl: i }); piv[piv.length - 1] = cd; }
        } else {
          const a = isNaN(atr[i]) ? 0 : atr[i];
          if (Math.abs(price - last.price) >= cfg.minSwingAtr * a) piv.push(cd);
        }
      }
    }
    let qh = -1, ql = -1;
    for (let q = piv.length - 1; q >= 0 && (qh < 0 || ql < 0); q--) {
      if (qh < 0 && piv[q].kind === "H") qh = q;
      if (ql < 0 && piv[q].kind === "L") ql = q;
    }
    if (qh >= 0 && ql >= 0) {
      const sh = piv[qh], sl = piv[ql];
      ush[i] = sh; usl[i] = sl;
      const pxLo = cfg.useWick ? l[i] : c[i], pxHi = cfg.useWick ? h[i] : c[i];
      const dn = pxLo < sl.price, up = pxHi > sh.price;
      let dir = 0;
      if (dn && up) dir = c[i] >= o[i] ? UP : DOWN; else dir = dn ? DOWN : up ? UP : 0;
      if (dir === DOWN) {
        const prev = ql >= 1 ? piv[ql - 1] : null;
        let rally = -Infinity; for (let k = sl.bar; k < i; k++) if (h[k] > rally) rally = h[k];
        if (prev && prev.kind === "H" && rally < prev.price) state = DOWN;
        else if (state === UP) state = RANGE;
      } else if (dir === UP) {
        const prev = qh >= 1 ? piv[qh - 1] : null;
        let pull = Infinity; for (let k = sh.bar; k < i; k++) if (l[k] < pull) pull = l[k];
        if (prev && prev.kind === "L" && pull > prev.price) state = UP;
        else if (state === DOWN) state = RANGE;
      }
    }
    trend[i] = state;
  }
  return { trend, piv, old, ush, usl };
}

/* ---------- 状態 ---------- */
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d"), info = $("info");
let d, res, view = { from: 0, to: 1 }, mouse = null, dpr = 1, W = 0, H = 0, drag = null;
const M = { l: 8, r: 64, t: 10, b: 24 };
const fmtT = (s, intraday) => { const x = new Date(s * 1000).toISOString(); return x.slice(0, 10) + (intraday ? " " + x.slice(11, 16) : ""); };
const dec = 5;

function recompute() {
  const tf = $("tf").value, first = d !== DATA[tf];
  const prevTime = d ? d.t[Math.min(d.t.length - 1, Math.max(0, Math.round((view.from + view.to) / 2)))] : null;
  d = DATA[tf];
  $("nv").textContent = $("n").value; $("apv").textContent = $("ap").value; $("mav").textContent = (+$("ma").value).toFixed(1);
  const t0 = performance.now();
  res = computeDow(d, { n: +$("n").value, atrPeriod: +$("ap").value, minSwingAtr: +$("ma").value, useWick: $("wick").checked });
  const ms = (performance.now() - t0).toFixed(0);
  let seg = 0; for (let i = 1; i < d.t.length; i++) if (res.trend[i] !== res.trend[i-1]) seg++;
  let trs = "";
  if (TR) {
    const rs = TR.trades.map(t => t.pnl / TR.risk), wins = rs.filter(r => r > 0).length;
    trs = ` / トレード ${rs.length} 件（${TR.mode}）勝率 ${(wins / rs.length * 100).toFixed(1)}% 合計 ${rs.reduce((a, b) => a + b, 0).toFixed(2)}R`;
    $("eln").disabled = !d.esh; $("elnlab").style.opacity = d.esh ? 1 : .4;
  }
  $("stat").textContent = `足 ${d.t.length.toLocaleString()} 本 / スイング ${res.piv.length} 個 / 判定切替 ${seg} 回 / ${ms}ms${trs}`;
  if (first && prevTime !== null) { // 時間足を変えたら同じ時刻付近を表示
    const span = view.to - view.from, ratio = d.t.length;
    let lo = 0, hi = d.t.length - 1; while (lo < hi) { const m = (lo + hi) >> 1; if (d.t[m] < prevTime) lo = m + 1; else hi = m; }
    view = { from: lo - span / 2, to: lo + span / 2 };
  }
  draw();
}

function resetView() { view = { from: 0, to: d.t.length }; draw(); }

/* ---------- 描画 ---------- */
function resize() {
  dpr = window.devicePixelRatio || 1;
  const r = cv.getBoundingClientRect(); W = r.width; H = r.height;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); draw();
}
function clampView() {
  const n = d.t.length, span = Math.max(20, Math.min(n + 20, view.to - view.from));
  let f = view.from; f = Math.max(-span * 0.3, Math.min(n - span * 0.7, f));
  view = { from: f, to: f + span };
}
function draw() {
  if (!d || !res || !W) return;
  clampView();
  ctx.clearRect(0, 0, W, H);
  const pw = W - M.l - M.r, ph = H - M.t - M.b, span = view.to - view.from, bw = pw / span;
  const i0 = Math.max(0, Math.floor(view.from)), i1 = Math.min(d.t.length - 1, Math.ceil(view.to));
  let lo = Infinity, hi = -Infinity;
  for (let i = i0; i <= i1; i++) { if (d.l[i] < lo) lo = d.l[i]; if (d.h[i] > hi) hi = d.h[i]; }
  if (TR && $("trd").checked)  // 表示中のトレードの SL/TP も縦軸の範囲に入れる
    for (const t of TR.trades) {
      const [ei, xi] = tradeIdx(t); if (ei < 0 || xi < i0 || ei > i1) continue;
      for (const p of [t.sl, t.tp]) if (p != null) { lo = Math.min(lo, p); hi = Math.max(hi, p); }
    }
  const pad = (hi - lo) * 0.06 || 0.001; lo -= pad; hi += pad;
  const X = i => M.l + (i - view.from + 0.5) * bw, Y = p => M.t + (hi - p) / (hi - lo) * ph;
  const intraday = !["D1", "W1"].includes($("tf").value);

  // トレンド背景（トレード表示ありで「検証で使った週足トレンド」を選んでいるときは d.ut を使う）
  const bgt = bgTrend();
  if ($("shade").checked) {
    let s = i0;
    for (let i = i0 + 1; i <= i1 + 1; i++) {
      if (i > i1 || bgt[i] !== bgt[s]) {
        const st = bgt[s];
        if (st !== 0) { ctx.fillStyle = st === UP ? "rgba(43,182,115,.13)" : "rgba(229,83,75,.13)";
          ctx.fillRect(M.l + (s - view.from) * bw, M.t, (i - s) * bw, ph); }
        s = i;
      }
    }
  }
  // グリッド・軸
  ctx.font = "11px system-ui"; ctx.textBaseline = "middle"; ctx.fillStyle = "#8b95a1"; ctx.strokeStyle = "#262d36"; ctx.lineWidth = 1;
  const rough = (hi - lo) / (ph / 60), mag = Math.pow(10, Math.floor(Math.log10(rough)));
  const step = [1, 2, 5, 10].map(m => m * mag).find(s => s >= rough);
  ctx.textAlign = "left";
  for (let p = Math.ceil(lo / step) * step; p < hi; p += step) {
    const y = Math.round(Y(p)) + .5; ctx.beginPath(); ctx.moveTo(M.l, y); ctx.lineTo(M.l + pw, y); ctx.stroke();
    ctx.fillText(p.toFixed(dec), M.l + pw + 6, y);
  }
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  const tickN = Math.max(2, Math.floor(pw / 130)), ts = Math.max(1, Math.round(span / tickN));
  for (let i = Math.ceil(view.from / ts) * ts; i < view.to; i += ts) {
    if (i < 0 || i >= d.t.length) continue;
    const x = Math.round(X(i)) + .5; ctx.beginPath(); ctx.moveTo(x, M.t); ctx.lineTo(x, M.t + ph); ctx.stroke();
    ctx.fillText(fmtT(d.t[i], intraday && span < 2500), x, M.t + ph + 6);
  }
  // ローソク足
  ctx.save(); ctx.beginPath(); ctx.rect(M.l, M.t, pw, ph); ctx.clip();
  const body = Math.max(1, bw * 0.7);
  for (let i = i0; i <= i1; i++) {
    const x = X(i), up = d.c[i] >= d.o[i], col = up ? "#2bb673" : "#e5534b";
    ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(Math.round(x) + .5, Y(d.h[i])); ctx.lineTo(Math.round(x) + .5, Y(d.l[i])); ctx.stroke();
    const yo = Y(d.o[i]), yc = Y(d.c[i]);
    ctx.fillRect(x - body / 2, Math.min(yo, yc), body, Math.max(1, Math.abs(yo - yc)));
  }
  // スイング線とマーカー
  const P = res.piv;
  if ($("zig").checked) {
    ctx.strokeStyle = "rgba(215,220,226,.55)"; ctx.lineWidth = 1.2; ctx.beginPath();
    let started = false;
    for (const p of P) { const x = X(p.bar), y = Y(p.price); if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y); }
    ctx.stroke();
  }
  const r = Math.max(3, Math.min(7, bw * 0.6 + 2));
  if ($("oldp").checked) // 後から同じ種類のより極端なピボットに置き換えられたもの（判定の時点では使われていた）。白抜きで表示
    for (const p of res.old) {
      if (p.bar < view.from - 2 || p.bar > view.to + 2) continue;
      const x = X(p.bar), y = Y(p.price), isH = p.kind === "H", off = isH ? -r - 3 : r + 3;
      ctx.strokeStyle = isH ? "rgba(242,184,75,.8)" : "rgba(74,168,242,.8)"; ctx.lineWidth = 1.2; ctx.beginPath();
      if (isH) { ctx.moveTo(x, y - 3); ctx.lineTo(x - r, y + off); ctx.lineTo(x + r, y + off); }
      else { ctx.moveTo(x, y + 3); ctx.lineTo(x - r, y + off); ctx.lineTo(x + r, y + off); }
      ctx.closePath(); ctx.stroke();
    }
  for (const p of P) {
    if (p.bar < view.from - 2 || p.bar > view.to + 2) continue;
    const x = X(p.bar), y = Y(p.price), isH = p.kind === "H";
    if ($("conf").checked) {
      ctx.strokeStyle = isH ? "rgba(242,184,75,.6)" : "rgba(74,168,242,.6)"; ctx.setLineDash([3, 3]); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(X(p.conf), y); ctx.stroke(); ctx.setLineDash([]);
      ctx.beginPath(); ctx.arc(X(p.conf), y, 2.5, 0, 6.3); ctx.fillStyle = isH ? "#f2b84b" : "#4aa8f2"; ctx.fill();
    }
    ctx.fillStyle = isH ? "#f2b84b" : "#4aa8f2"; ctx.beginPath();
    const off = isH ? -r - 3 : r + 3;
    if (isH) { ctx.moveTo(x, y - 3); ctx.lineTo(x - r, y + off); ctx.lineTo(x + r, y + off); }
    else { ctx.moveTo(x, y + 3); ctx.lineTo(x - r, y + off); ctx.lineTo(x + r, y + off); }
    ctx.closePath(); ctx.fill();
  }
  if (TR) drawTrades(i0, i1, X, Y, bw);
  ctx.restore();
  // クロスヘア
  if (mouse && mouse.x > M.l && mouse.x < M.l + pw && mouse.y > M.t && mouse.y < M.t + ph) {
    ctx.strokeStyle = "rgba(255,255,255,.3)"; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(mouse.x, M.t); ctx.lineTo(mouse.x, M.t + ph); ctx.moveTo(M.l, mouse.y); ctx.lineTo(M.l + pw, mouse.y); ctx.stroke(); ctx.setLineDash([]);
    const price = hi - (mouse.y - M.t) / ph * (hi - lo);
    ctx.fillStyle = "#38414d"; ctx.fillRect(M.l + pw, mouse.y - 8, M.r, 16);
    ctx.fillStyle = "#fff"; ctx.textAlign = "left"; ctx.textBaseline = "middle"; ctx.fillText(price.toFixed(dec), M.l + pw + 6, mouse.y);
    const i = Math.floor((mouse.x - M.l) / bw + view.from);
    if (i >= 0 && i < d.t.length) {
      ctx.save(); ctx.beginPath(); ctx.rect(M.l, M.t, pw, ph); ctx.clip(); ctx.lineWidth = 1.5;
      for (const [q, col] of [[res.ush[i], "#f2b84b"], [res.usl[i], "#4aa8f2"]]) { // この足の判定に使ったスイングハイ/ロー
        if (!q) continue;
        ctx.strokeStyle = col; ctx.setLineDash([6, 3]); ctx.beginPath(); ctx.moveTo(X(q.bar), Y(q.price)); ctx.lineTo(X(i), Y(q.price)); ctx.stroke();
        ctx.setLineDash([]); ctx.beginPath(); ctx.arc(X(q.bar), Y(q.price), 4, 0, 6.3); ctx.stroke();
      }
      ctx.restore();
      const nm = tr => tr === 1 ? "上昇" : tr === -1 ? "下降" : "レンジ";
      let txt = `${fmtT(d.t[i], intraday)}  (NY時間, #${i})\nO ${d.o[i].toFixed(dec)}  H ${d.h[i].toFixed(dec)}\nL ${d.l[i].toFixed(dec)}  C ${d.c[i].toFixed(dec)}\nトレンド判定（この時間足）: ${nm(res.trend[i])}`;
      const pv = (q, nmk) => q ? `${nmk} ${fmtP(q.price)}（${fmtT(d.t[q.bar], intraday)} の足、${fmtT(d.t[q.conf], intraday)} に確定）` : `${nmk} なし`;
      txt += `\n判定に使ったスイング（破線）\n  ${pv(res.ush[i], "ハイ")}\n  ${pv(res.usl[i], "ロー")}`;
      if (TR && d.ut) txt += `\n週足トレンド（検証で使用）: ${nm(d.ut[i] ?? 0)}`;
      if (TR && d.esh && $("eln").checked)
        txt += `\nエントリーライン 買い ${fmtP(d.esh[i])}${d.eshv[i] ? "" : "（無効）"} / 売り ${fmtP(d.esl[i])}${d.eslv[i] ? "" : "（無効）"}`;
      const t = TR && $("trd").checked ? tradeAt(i, mouse.y, Y) : null;
      if (t) txt += "\n" + tradeText(t);
      info.textContent = txt;
    }
  } else if (TR && cur >= 0) info.textContent = `トレード ${cur + 1} / ${TR.trades.length}\n` + tradeText(TR.trades[cur]);
  else info.innerHTML =
    `<span class="sw" style="background:var(--sh)"></span>スイングハイ　<span class="sw" style="background:var(--sl)"></span>スイングロー　` +
    `<span class="sw" style="background:rgba(43,182,115,.5)"></span>上昇　<span class="sw" style="background:rgba(229,83,75,.5)"></span>下降　背景なし=レンジ` +
    (TR ? `<br><span class="sw" style="background:#b18cff"></span>▲買い / <span class="sw" style="background:#ff6fd1"></span>▼売り エントリー　● 決済（緑=勝ち / 赤=負け）　点線=SL・TP　<span class="sw" style="background:#c9a227"></span>買いライン　<span class="sw" style="background:#5b8fd9"></span>売りライン（薄い=無効）` : "");
}

/* ---------- トレード表示（TR があるときだけ） ---------- */
const fmtP = p => p == null ? "-" : (+p).toFixed(dec);
function bgTrend() {
  if (TR && d.ut && $("bg").value === "used") return d.ut.map(v => v ?? 0);
  return res.trend;
}
function tradeIdx(t) { return t.idx[$("tf").value]; }
function tradeText(t) {
  const r = t.pnl / TR.risk, nm = v => v === 1 ? "上昇" : v === -1 ? "下降" : "レンジ";
  return `── トレード（${t.d > 0 ? "買い" : "売り"} / 週足 ${nm(t.wk)}）──\n` +
    `エントリー ${t.et}  @ ${fmtP(t.ep)}\n決済       ${t.xt}  @ ${fmtP(t.xp)}\n` +
    `SL ${fmtP(t.sl)}  TP ${fmtP(t.tp)}  枚数 ${Math.abs(t.size).toLocaleString()}\n` +
    `損益 ${t.pnl.toFixed(2)}（${r >= 0 ? "+" : ""}${r.toFixed(2)}R） ${t.reason}`;
}
function tradeAt(i, my, Y) {
  // カーソルの足を含むトレードのうち、エントリー価格〜決済価格が縦方向に一番近いもの
  let best = null, bd = Infinity;
  for (const t of TR.trades) {
    const [ei, xi] = tradeIdx(t);
    if (ei < 0 || i < ei - 1 || i > Math.max(ei, xi) + 1) continue;
    const ya = Y(t.ep), yb = Y(t.xp), dist = my < Math.min(ya, yb) ? Math.min(ya, yb) - my : my > Math.max(ya, yb) ? my - Math.max(ya, yb) : 0;
    if (dist < bd) { bd = dist; best = t; }
  }
  return bd < 40 ? best : null;
}
function drawTrades(i0, i1, X, Y, bw) {
  // エントリーライン（4時間足 Swing High/Low。1本前の判定足までの確定情報＝バックテストと同じ値）
  if (d.esh && $("eln").checked) {
    for (const [arr, val, col] of [[d.esh, d.eshv, "201,162,39"], [d.esl, d.eslv, "91,143,217"]]) {
      ctx.lineWidth = 1.5;
      for (let i = i0; i <= i1; i++) {
        if (arr[i] == null) continue;
        ctx.strokeStyle = `rgba(${col},${val[i] ? .85 : .25})`;
        const y = Y(arr[i]); ctx.beginPath(); ctx.moveTo(X(i) - bw / 2, y); ctx.lineTo(X(i) + bw / 2, y); ctx.stroke();
      }
    }
  }
  if (!$("trd").checked) return;
  const s = Math.max(5, Math.min(9, bw * 0.7 + 3));
  for (const t of TR.trades) {
    const [ei, xi] = tradeIdx(t);
    if (ei < 0 || xi < i0 - 1 || ei > i1 + 1) continue;
    const win = t.pnl > 0, col = win ? "#2bd17e" : "#ff5a52";
    const xe = X(ei), xx = X(xi), ye = Y(t.ep), yx = Y(t.xp);
    // SL / TP（エントリーから決済まで）
    ctx.setLineDash([2, 3]); ctx.lineWidth = 1;
    if (t.tp != null) { ctx.strokeStyle = "rgba(43,209,126,.7)"; ctx.beginPath(); ctx.moveTo(xe, Y(t.tp)); ctx.lineTo(xx, Y(t.tp)); ctx.stroke(); }
    if (t.sl != null) { ctx.strokeStyle = "rgba(255,90,82,.7)"; ctx.beginPath(); ctx.moveTo(xe, Y(t.sl)); ctx.lineTo(xx, Y(t.sl)); ctx.stroke(); }
    // エントリー → 決済
    ctx.setLineDash([5, 3]); ctx.lineWidth = 2; ctx.strokeStyle = col;
    ctx.beginPath(); ctx.moveTo(xe, ye); ctx.lineTo(xx, yx); ctx.stroke(); ctx.setLineDash([]);
    // エントリー（▲買い / ▼売り）
    ctx.fillStyle = t.d > 0 ? "#b18cff" : "#ff6fd1"; ctx.strokeStyle = "#fff"; ctx.lineWidth = 1;
    ctx.beginPath();
    if (t.d > 0) { ctx.moveTo(xe, ye); ctx.lineTo(xe - s, ye + s * 1.5); ctx.lineTo(xe + s, ye + s * 1.5); }
    else { ctx.moveTo(xe, ye); ctx.lineTo(xe - s, ye - s * 1.5); ctx.lineTo(xe + s, ye - s * 1.5); }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // 決済
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(xx, yx, s * 0.6, 0, 6.3); ctx.fill(); ctx.stroke();
  }
}
let cur = -1;
function gotoTrade(step) {
  if (!TR || !TR.trades.length) return;
  const mid = (view.from + view.to) / 2;
  if (cur < 0) {  // 表示中の中央より後ろ（前）で一番近いトレードから
    const list = TR.trades.map((t, k) => [tradeIdx(t)[0], k]).filter(([e]) => e >= 0);
    const c = step > 0 ? list.find(([e]) => e > mid) : [...list].reverse().find(([e]) => e < mid);
    cur = c ? c[1] : (step > 0 ? 0 : TR.trades.length - 1);
  } else cur = Math.max(0, Math.min(TR.trades.length - 1, cur + step));
  const [ei, xi] = tradeIdx(TR.trades[cur]);
  const span = Math.max(60, Math.min(400, (xi - ei) * 4 + 40));
  const c = (ei + xi) / 2; view = { from: c - span / 2, to: c + span / 2 }; mouse = null; draw();
}

/* ---------- 操作 ---------- */
cv.addEventListener("wheel", e => {
  e.preventDefault();
  const pw = W - M.l - M.r, span = view.to - view.from, r = cv.getBoundingClientRect();
  const anchor = view.from + (e.clientX - r.left - M.l) / pw * span;
  if (e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)) { const dx = (e.deltaX || e.deltaY) / pw * span; view = { from: view.from + dx, to: view.to + dx }; }
  else { const k = Math.exp(e.deltaY * 0.0015), ns = span * k; const f = (anchor - view.from) / span; view = { from: anchor - f * ns, to: anchor + (1 - f) * ns }; }
  draw();
}, { passive: false });
cv.addEventListener("mousedown", e => { drag = { x: e.clientX, from: view.from, to: view.to }; });
window.addEventListener("mouseup", () => drag = null);
window.addEventListener("mousemove", e => {
  const r = cv.getBoundingClientRect(); mouse = { x: e.clientX - r.left, y: e.clientY - r.top };
  if (drag) { const pw = W - M.l - M.r, dx = (e.clientX - drag.x) / pw * (drag.to - drag.from); view = { from: drag.from - dx, to: drag.to - dx }; }
  draw();
});
cv.addEventListener("mouseleave", () => { mouse = null; draw(); });
// タッチ（1本指で移動、2本指でピンチ）
let tch = null;
cv.addEventListener("touchstart", e => { tch = { n: e.touches.length, x: e.touches[0].clientX, dist: e.touches.length > 1 ? Math.abs(e.touches[0].clientX - e.touches[1].clientX) : 0, v: { ...view } }; }, { passive: true });
cv.addEventListener("touchmove", e => {
  if (!tch) return; e.preventDefault();
  const pw = W - M.l - M.r, span = tch.v.to - tch.v.from;
  if (e.touches.length > 1 && tch.dist) {
    const k = tch.dist / Math.abs(e.touches[0].clientX - e.touches[1].clientX), c = (tch.v.from + tch.v.to) / 2;
    view = { from: c - span * k / 2, to: c + span * k / 2 };
  } else { const dx = (e.touches[0].clientX - tch.x) / pw * span; view = { from: tch.v.from - dx, to: tch.v.to - dx }; }
  draw();
}, { passive: false });
let timer = null;
for (const id of ["n", "ap", "ma", "tf"]) $(id).addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(recompute, 30); });
for (const id of ["wick"]) $(id).addEventListener("change", recompute);
for (const id of ["shade", "zig", "conf"]) $(id).addEventListener("change", draw);
$("reset").onclick = resetView;
if (TR) {
  $("trctl").style.display = "inline-flex";
  if (!DATA["4H"].ut) { $("bg").value = "tf"; $("bg").options[0].disabled = true; }  // 週足トレンドを使わない戦略
  for (const id of ["trd", "eln", "bg"]) $(id).addEventListener("change", draw);
  $("prev").onclick = () => gotoTrade(-1); $("next").onclick = () => gotoTrade(1);
  window.addEventListener("keydown", e => { if (e.key === "ArrowRight") gotoTrade(1); else if (e.key === "ArrowLeft") gotoTrade(-1); });
}
$("jump").addEventListener("change", e => {
  const s = Date.parse(e.target.value + "T00:00:00Z") / 1000; if (isNaN(s)) return;
  let lo = 0, hi = d.t.length - 1; while (lo < hi) { const m = (lo + hi) >> 1; if (d.t[m] < s) lo = m + 1; else hi = m; }
  const span = Math.min(view.to - view.from, 300); view = { from: lo - span * 0.1, to: lo + span * 0.9 }; draw();
});
window.addEventListener("resize", resize);

d = DATA["4H"]; res = null;
resize(); recompute();
view = { from: d.t.length - 300, to: d.t.length + 10 }; recompute();
window.__dow = { computeDow, DATA }; // 検証用
</script>
