# カップウィズハンドル FX（ATRベース）の設定。閾値はすべて仕様書の初期値。
# 一時的に変えて実行するときは、このファイルを書き換えずに run_backtest.py の --set key=value で上書きする。

# ---- データ・期間 ----
pairs: null                    # null なら histData/ にある FX ペア全部（SP500 などは除く）
bar_hours: 24                  # 判定・執行の足。24 = 日足（NY 17:00 区切り）
start_date: "2020-01-01"       # 取引日でこの範囲のシグナルだけ使う（指標の助走には範囲外の足も使う）
end_date: "2025-12-31"         # USDJPY・EURUSD のデータが 2025-12 までなので全ペアをここで揃える
directions: [1, -1]            # 1=ロング（カップ） / -1=ショート（逆カップ）

# ---- 指標 ----
atr_short: 14          # ATR14: エントリー・損切り・トレーリング用
atr_long: 50           # ATR50: 深さ・押し幅の正規化用
sma_trend: 200
sma_slope_lookback: 20
swing_window: 5        # 左縁のスイングハイ: 左右5本で最高値

# ---- パターン（仕様 4） ----
prior_uptrend_min_atr: 6.0
prior_uptrend_lookback: 60
cup_len_min: 30
cup_len_max: 150
cup_depth_min_atr: 3.0
cup_depth_max_atr: 10.0
cup_round_band_atr: 1.5
cup_round_min_ratio: 0.20
cup_low_pos_min: 0.25
cup_low_pos_max: 0.75
right_rim_tolerance_atr: 1.0
right_rim_mode: min            # min: H_right >= H_left − tol（仕様 4.3 の文面どおり） / range: |H_right − H_left| <= tol
left_rim_highest: true         # 左縁〜カップの底の間に左縁より高い足が無いこと
handle_len_min: 5
handle_len_max: 25
handle_pullback_min_atr: 0.5
handle_pullback_max_atr: 2.5
handle_pullback_max_ratio: 0.5
handle_atr_contraction: 0.8

# ---- エントリー（仕様 5） ----
breakout_buffer_atr: 0.1
max_chase_atr: 1.0
signal_expiry_bars: 10

# ---- エグジット（仕様 6） ----
stop_buffer_atr: 0.5
stop_min_atr: 1.0
stop_max_atr: 3.0
tp1_r: 2.0
tp1_ratio: 0.5
trail_atr_mult: 3.0
trail_ratchet: true            # チャンデリアのラインを有利な方向にだけ動かす
time_stop_bars: 40
time_stop_min_r: 1.0

# ---- 資金管理（仕様 7・10） ----
account_currency: JPY
initial_equity: 10000000       # 1,000万円
risk_per_trade: 0.005
lot_units: 100000
min_lot: 0.01
max_leverage: 10.0             # 保有中の全ポジションの想定元本 <= 有効証拠金 × これ
max_positions: 3
max_exposure_per_currency: 2
one_position_per_pair: true    # 同じペアの2つ目のポジションは持たない
priority: shallow              # 同じ日に複数シグナル: shallow = depth_atr が小さい順 / sma_distance = SMA200 からの乖離が大きい順

# ---- コスト（仕様 9） ----
# スプレッド（pips）。GMOクリック証券の1分足データ（2020-01〜）の ASK−BID の平均を 0.1pips 単位で切り上げた値。
spread_pips:
  USDJPY: 0.4
  EURUSD: 0.5
  GBPUSD: 1.3
  AUDUSD: 0.9
  USDCHF: 2.0
spread_mult: 1.0               # コスト感度の検証用（2.0 でスプレッド2倍）
slippage_pips: 0.5             # 成行（エントリー・トレーリング・タイムストップ）
stop_slippage_pips: 1.0        # 逆指値（損切り・建値ストップ）
# スワップ: 1万通貨・1日あたりの受取(+)/支払(−)を、そのペアの決済通貨の pips で書く。
# 例) USDJPY: {long: 1.5, short: -1.8}。未設定のペア・方向は 0 とし、警告を出す。水曜のロールオーバーは3日分。
swap_pips_per_day: {}
