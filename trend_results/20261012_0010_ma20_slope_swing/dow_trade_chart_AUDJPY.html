function atrWilder(h, l, c, period) {
  const n = c.length, tr = new Float64Array(n), atr = new Float64Array(n).fill(NaN);
  tr[0] = h[0] - l[0];
  for (let i = 1; i < n; i++) tr[i] = Math.max(h[i] - l[i], Math.abs(h[i] - c[i-1]), Math.abs(l[i] - c[i-1]));
  if (n >= period) {
    let s = 0; for (let i = 0; i < period; i++) s += tr[i];
    atr[period-1] = s / period;
    for (let i = period; i < n; i++) atr[i] = (atr[i-1] * (period - 1) + tr[i]) / period;
  }
  return atr;
}
function computeDow(d, cfg) {
  const { o, h, l, c } = d, nb = c.length, n = cfg.n;
  const atr = atrWilder(h, l, c, cfg.atrPeriod);
  const piv = [], trend = new Int8Array(nb);
  let state = RANGE;
  for (let i = 0; i < nb; i++) {
    const j = i - n;
    if (j >= n) {
      let mh = -Infinity, ml = Infinity, ch = 0, cl = 0;
      for (let k = j - n; k <= j + n; k++) {
        if (h[k] > mh) { mh = h[k]; ch = 1 } else if (h[k] === mh) ch++;
        if (l[k] < ml) { ml = l[k]; cl = 1 } else if (l[k] === ml) cl++;
      }
      const cands = [];
      if (h[j] === mh && ch === 1) cands.push(["H", j, h[j]]);
      if (l[j] === ml && cl === 1) cands.push(["L", j, l[j]]);
      for (const [kind, idx, price] of cands) {
        const cd = { kind, bar: idx, price, conf: i };
        if (!piv.length) { piv.push(cd); continue; }
        const last = piv[piv.length - 1];
        if (last.kind === kind) {
          if ((kind === "H" && price > last.price) || (kind === "L" && price < last.price)) piv[piv.length - 1] = cd;
        } else {
          const a = isNaN(atr[i]) ? 0 : atr[i];
          if (Math.abs(price - last.price) >= cfg.minSwingAtr * a) piv.push(cd);
        }
      }
    }
    let qh = -1, ql = -1;
    for (let q = piv.length - 1; q >= 0 && (qh < 0 || ql < 0); q--) {
      if (qh < 0 && piv[q].kind === "H") qh = q;
      if (ql < 0 && piv[q].kind === "L") ql = q;
    }
    if (qh >= 0 && ql >= 0) {
      const sh = piv[qh], sl = piv[ql];
      const pxLo = cfg.useWick ? l[i] : c[i], pxHi = cfg.useWick ? h[i] : c[i];
      const dn = pxLo < sl.price, up = pxHi > sh.price;
      let dir = 0;
      if (dn && up) dir = c[i] >= o[i] ? UP : DOWN; else dir = dn ? DOWN : up ? UP : 0;
      if (dir === DOWN) {
        const prev = ql >= 1 ? piv[ql - 1] : null;
        let rally = -Infinity; for (let k = sl.bar; k < i; k++) if (h[k] > rally) rally = h[k];
        if (prev && prev.kind === "H" && rally < prev.price) state = DOWN;
        else if (state === UP) state = RANGE;
      } else if (dir === UP) {
        const prev = qh >= 1 ? piv[qh - 1] : null;
        let pull = Infinity; for (let k = sh.bar; k < i; k++) if (l[k] < pull) pull = l[k];
        if (prev && prev.kind === "L" && pull > prev.price) state = UP;
        else if (state === DOWN) state = RANGE;
      }
    }
    trend[i] = state;
  }

}

/* ---------- ライブ計算: 日足 MA / ER / フィルターをスライダーの値で計算し直す ---------- */

function liveCalc() {

  $("erpv").textContent = per; $("erthv").textContent = th.toFixed(2);
  const sma = p => { const a = new Array(n).fill(null); let sum = 0; for (let i = 0; i < n; i++) { sum += c[i]; if (i >= p) sum -= c[i - p]; if (i >= p - 1) a[i] = sum / p; } return a; };
  const mas = DLIVE.ma.map(sma);

  for (let i = 1; i < n; i++) ad.push(Math.abs(c[i] - c[i - 1]));
  for (let i = per; i < n; i++) { let sum = 0; for (let k = i - per + 1; k <= i; k++) sum += ad[k]; er[i] = sum > 0 ? Math.abs(c[i] - c[i - per]) / sum : null; }

    ctx.setLineDash([5, 3]); ctx.lineWidth = 2; ctx.strokeStyle = col;
    ctx.beginPath(); ctx.moveTo(xe, ye); ctx.lineTo(xx, yx); ctx.stroke(); ctx.setLineDash([]);
    // エントリー（▲買い / ▼売り）
    ctx.fillStyle = t.d > 0 ? "#b18cff" : "#ff6fd1"; ctx.strokeStyle = "#fff"; ctx.lineWidth = 1;
    ctx.beginPath();
    if (t.d > 0) { ctx.moveTo(xe, ye); ctx.lineTo(xe - s, ye + s * 1.5); ctx.lineTo(xe + s, ye + s * 1.5); }
    else { ctx.moveTo(xe, ye); ctx.lineTo(xe - s, ye - s * 1.5); ctx.lineTo(xe + s, ye - s * 1.5); }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // 決済
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(xx, yx, s * 0.6, 0, 6.3); ctx.fill(); ctx.stroke();
    ctx.globalAlpha = 1;

}
let cur = -1;
function gotoTrade(step) {
  if (!TR || !TR.trades.length) return;
  const mid = (view.from + view.to) / 2;
  if (cur < 0) {  // 表示中の中央より後ろ（前）で一番近いトレードから
    const list = TR.trades.map((t, k) => [tradeIdx(t)[0], k]).filter(([e, k]) => e >= 0 && visT(TR.trades[k]));
    const c = step > 0 ? list.find(([e]) => e > mid) : [...list].reverse().find(([e]) => e < mid);
    cur = c ? c[1] : (step > 0 ? 0 : TR.trades.length - 1);
  } else cur = Math.max(0, Math.min(TR.trades.length - 1, cur + step));
  const [ei, xi] = tradeIdx(TR.trades[cur]);
  const span = Math.max(60, Math.min(400, (xi - ei) * 4 + 40));
  const c = (ei + xi) / 2; view = { from: c - span / 2, to: c + span / 2 }; mouse = null; draw();
}

/* ---------- 操作 ---------- */
cv.addEventListener("wheel", e => {
  e.preventDefault();
  const pw = W - M.l - M.r, span = view.to - view.from, r = cv.getBoundingClientRect();
  const anchor = view.from + (e.clientX - r.left - M.l) / pw * span;
  if (e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)) { const dx = (e.deltaX || e.deltaY) / pw * span; view = { from: view.from + dx, to: view.to + dx }; }
  else { const k = Math.exp(e.deltaY * 0.0015), ns = span * k; const f = (anchor - view.from) / span; view = { from: anchor - f * ns, to: anchor + (1 - f) * ns }; }
  draw();
}, { passive: false });
cv.addEventListener("mousedown", e => { drag = { x: e.clientX, from: view.from, to: view.to }; });
window.addEventListener("mouseup", () => drag = null);
window.addEventListener("mousemove", e => {
  const r = cv.getBoundingClientRect(); mouse = { x: e.clientX - r.left, y: e.clientY - r.top };
  if (drag) { const pw = W - M.l - M.r, dx = (e.clientX - drag.x) / pw * (drag.to - drag.from); view = { from: drag.from - dx, to: drag.to - dx }; }
  draw();
});
cv.addEventListener("mouseleave", () => { mouse = null; draw(); });
// タッチ（1本指で移動、2本指でピンチ）
let tch = null;
cv.addEventListener("touchstart", e => { tch = { n: e.touches.length, x: e.touches[0].clientX, dist: e.touches.length > 1 ? Math.abs(e.touches[0].clientX - e.touches[1].clientX) : 0, v: { ...view } }; }, { passive: true });
cv.addEventListener("touchmove", e => {
  if (!tch) return; e.preventDefault();
  const pw = W - M.l - M.r, span = tch.v.to - tch.v.from;
  if (e.touches.length > 1 && tch.dist) {
    const k = tch.dist / Math.abs(e.touches[0].clientX - e.touches[1].clientX), c = (tch.v.from + tch.v.to) / 2;
    view = { from: c - span * k / 2, to: c + span * k / 2 };
  } else { const dx = (e.touches[0].clientX - tch.x) / pw * span; view = { from: tch.v.from - dx, to: tch.v.to - dx }; }
  draw();
}, { passive: false });
let timer = null;
for (const id of ["n", "ap", "ma", "tf"]) $(id).addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(recompute, 30); });
for (const id of ["wick"]) $(id).addEventListener("change", recompute);
for (const id of ["shade", "zig", "conf", "smaon", "dma", "der"]) $(id).addEventListener("change", draw);
$("maper").addEventListener("change", draw);
if (DLIVE) {
  $("livectl").style.display = "inline-flex"; $("erp").value = DAILY.er; $("erth").value = DAILY.th;
  for (const id of ["erp", "erth"]) $(id).addEventListener("input", () => { applyLive(); draw(); });
  $("exc").addEventListener("change", draw);
}
if (!DATA["1H"]) { for (const o of $("tf").options) if (o.value === "1H") o.remove(); }
if (DAILY) { if (DAILY.ma) $("dmal").style.display = "flex"; if (DAILY.er) $("derl").style.display = "flex"; }
$("reset").onclick = resetView;
if (TR) {
  $("trctl").style.display = "inline-flex";
  if (!DATA["4H"].ut) { $("bg").value = "tf"; $("bg").options[0].disabled = true; }  // 週足トレンドを使わない戦略
  if (DLIVE) $("bg").value = "live"; else if (DATA["4H"].fs) $("bg").value = "filter"; else $("bg").value = $("bg").value;
  if (!DATA["4H"].fs) $("bg").options[2].disabled = true;
  if (!DLIVE) $("bg").options[3].disabled = true;  // 方向フィルターを使った検証
  for (const id of ["trd", "eln", "bg"]) $(id).addEventListener("change", draw);
  $("prev").onclick = () => gotoTrade(-1); $("next").onclick = () => gotoTrade(1);
  window.addEventListener("keydown", e => { if (e.key === "ArrowRight") gotoTrade(1); else if (e.key === "ArrowLeft") gotoTrade(-1); });
}
$("jump").addEventListener("change", e => {
  const s = Date.parse(e.target.value + "T00:00:00Z") / 1000; if (isNaN(s)) return;
  let lo = 0, hi = d.t.length - 1; while (lo < hi) { const m = (lo + hi) >> 1; if (d.t[m] < s) lo = m + 1; else hi = m; }
  const span = Math.min(view.to - view.from, 300); view = { from: lo - span * 0.1, to: lo + span * 0.9 }; draw();
});
window.addEventListener("resize", resize);
function setMin(on) {
  $("ctl").classList.toggle("min", on); $("ctltog").textContent = on ? "設定 ▾" : "設定 ▴";
  try { localStorage.setItem("dowCtlMin", on ? "1" : "0"); } catch (e) {}
  resize();
}
$("det").addEventListener("change", draw);
$("ctltog").onclick = () => setMin(!$("ctl").classList.contains("min"));
$("leg").addEventListener("change", () => { try { localStorage.setItem("dowLegend", $("leg").checked ? "1" : "0"); } catch (e) {} draw(); });
{ let m = null, lg = null; try { m = localStorage.getItem("dowCtlMin"); lg = localStorage.getItem("dowLegend"); } catch (e) {}
  const small = window.innerWidth < 1000 || window.innerHeight < 640;
  if (lg !== null ? lg === "0" : small) $("leg").checked = false;
  if (m !== null ? m === "1" : small) $("ctl").classList.add("min"), $("ctltog").textContent = "設定 ▾"; }

d = DATA["4H"]; res = null;
resize(); recompute();
view = { from: d.t.length - 300, to: d.t.length + 10 }; recompute();
