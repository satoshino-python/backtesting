function atrWilder(h, l, c, period) {

        else if (state === DOWN) state = RANGE;

}

    ($("smaon").checked ? "<br>" + maLines().map((m, k) => `<span class="sw" style="background:${MA_COLORS[k]}"></span>SMA${m.p}`).join("　") + `（${$("tf").value}足）` : "") +
    (DAILY && $("dma").checked ? "<br>" + DAILY.ma.map((p, k) => `<span class="sw" style="background:${DMA_COLORS[k]}"></span>日足MA${p}`).join("　") + "（前日確定）" : "") +
    (TR ? `<br><span class="sw" style="background:#b18cff"></span>▲買い / <span class="sw" style="background:#ff6fd1"></span>▼売り エントリー　● 決済（緑=勝ち / 赤=負け）　点線=SL・TP　<span class="sw" style="background:#c9a227"></span>買いライン　<span class="sw" style="background:#5b8fd9"></span>売りライン（薄い=無効）` : "");
  placeInfo(mouse ? [mouse.x, mouse.y] : (TR && cur >= 0 ? (() => { const t = TR.trades[cur], [ei, xi] = tradeIdx(t); return [X((ei + xi) / 2), Y(t.ep)]; })() : null));
}
/* 詳細ウィンドウは、カーソル（または選択中のトレード）と対角の隅に置いてチャートを隠さない */
function placeInfo(f) {
  const s = info.style; s.left = s.right = s.top = s.bottom = "auto";
  if (!f) { s.left = "10px"; s.top = "8px"; return; }
  if (f[0] < W / 2) s.right = (M.r + 8) + "px"; else s.left = "10px";
  if (f[1] < H / 2) s.bottom = (M.b + 8) + "px"; else s.top = "8px";
}

/* ---------- ライブ計算: 日足 MA / ER / フィルターをスライダーの値で計算し直す ---------- */
let live = null;
function liveCalc() {
  const c = DLIVE.c, n = c.length, per = +$("erp").value, th = +$("erth").value;
  $("erpv").textContent = per; $("erthv").textContent = th.toFixed(2);
  const sma = p => { const a = new Array(n).fill(null); let sum = 0; for (let i = 0; i < n; i++) { sum += c[i]; if (i >= p) sum -= c[i - p]; if (i >= p - 1) a[i] = sum / p; } return a; };
  const mas = DLIVE.ma.map(sma);
  const er = new Array(n).fill(null); let path = 0; const ad = [0];
  for (let i = 1; i < n; i++) ad.push(Math.abs(c[i] - c[i - 1]));
  for (let i = per; i < n; i++) { let sum = 0; for (let k = i - per + 1; k <= i; k++) sum += ad[k]; er[i] = sum > 0 ? Math.abs(c[i] - c[i - per]) / sum : null; }
  const up = [], dn = [];
  for (let i = 0; i < n; i++) {
    const [a, b, g] = mas.map(m => m[i]);
    const ok = a != null && b != null && g != null && er[i] != null && er[i] >= th;
    up.push(ok && a > b && b > g); dn.push(ok && a < b && b < g);
  }
  live = { mas, er, up, dn };
}
/* 各足（1H/4H/D1/W1）に、その足が属する日足の「前日確定」の値を割り当てる */
const dpCache = {};
function dailyPrev(ts) { // ts: 秒。属する日足の1本前の番号（無ければ -1）
  const L = DLIVE.t; let lo = 0, hi = L.length - 1;
  if (ts < L[0]) return -1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (L[m] <= ts) lo = m; else hi = m - 1; }
  return lo - 1;
}
function applyLive() {
  if (!DLIVE || !d) return;
  liveCalc();
  const tf = $("tf").value;
  if (!dpCache[tf]) dpCache[tf] = d.t.map(dailyPrev);
  const dp = dpCache[tf], get = a => dp.map(i => i >= 0 ? a[i] : null);
  d.dm0 = get(live.mas[0]); d.dm1 = get(live.mas[1]); d.dm2 = get(live.mas[2]); d.der = get(live.er);
  d.lf = dp.map(i => i < 0 ? 0 : live.up[i] ? 1 : live.dn[i] ? -1 : 0);
  let a = { n: 0, s: 0 }, b = { n: 0, s: 0 };
  for (const t of TR.trades) {
    if (t.dp === undefined) t.dp = dailyPrev(Date.parse(t.et.replace(" ", "T") + ":00Z") / 1000);
    const i = t.dp; t.ok = i >= 0 && (t.d > 0 ? live.up[i] : live.dn[i]);
    const r = t.pnl / TR.risk, g = t.ok ? a : b; g.n++; g.s += r;
  }
  const f = g => g.n ? `${g.n}件 平均 ${(g.s / g.n >= 0 ? "+" : "") + (g.s / g.n).toFixed(3)}R 合計 ${(g.s >= 0 ? "+" : "") + g.s.toFixed(1)}R` : "0件";
  $("lstat").innerHTML = `ER(${$("erp").value}) ≥ ${(+$("erth").value).toFixed(2)} の取引 → 通過: <b style="min-width:0;color:${a.s >= 0 ? "#2bd17e" : "#ff5a52"}">${f(a)}</b> ／ 除外: <b style="min-width:0;color:${b.s >= 0 ? "#2bd17e" : "#ff5a52"}">${f(b)}</b>`;
}
const visT = t => !DLIVE || t.ok || $("exc").checked;

/* ---------- 日足ER のパネル ---------- */
const erPer = () => DLIVE ? +$("erp").value : DAILY.er, erTh = () => DLIVE ? +$("erth").value : DAILY.th;
function erOn() { return !!(DAILY && DAILY.er && $("der").checked && d && d.der); }
function drawER(i0, i1, X, bw, pw, y0, y1) {
  const hh = y1 - y0, Ye = v => y1 - Math.max(0, Math.min(1, v)) * hh, th = erTh();
  ctx.fillStyle = "rgba(255,255,255,.035)"; ctx.fillRect(M.l, y0, pw, hh);
  ctx.font = "11px system-ui"; ctx.textAlign = "left"; ctx.textBaseline = "middle"; ctx.lineWidth = 1;
  for (const v of [0, 0.5, 1]) {
    const y = Math.round(Ye(v)) + .5; ctx.strokeStyle = "#262d36"; ctx.beginPath(); ctx.moveTo(M.l, y); ctx.lineTo(M.l + pw, y); ctx.stroke();
    ctx.fillStyle = "#8b95a1"; ctx.fillText(v.toFixed(1), M.l + pw + 6, y);
  }
  ctx.save(); ctx.beginPath(); ctx.rect(M.l, y0, pw, hh); ctx.clip();
  ctx.fillStyle = "rgba(43,182,115,.28)";
  for (let i = i0; i <= i1; i++) { const v = d.der[i]; if (v != null && v >= th) ctx.fillRect(X(i) - bw / 2, Ye(v), bw + .5, Ye(th) - Ye(v)); }
  ctx.strokeStyle = "#f2c14e"; ctx.lineWidth = 1.6; ctx.beginPath();
  let on = false;
  for (let i = Math.max(0, i0 - 1); i <= Math.min(d.t.length - 1, i1 + 1); i++) {
    const v = d.der[i]; if (v == null) { on = false; continue; }
    if (!on) { ctx.moveTo(X(i), Ye(v)); on = true; } else ctx.lineTo(X(i), Ye(v));
  }
  ctx.stroke(); ctx.restore();
  ctx.strokeStyle = "#e5534b"; ctx.setLineDash([5, 4]); ctx.lineWidth = 1; ctx.beginPath();
  ctx.moveTo(M.l, Math.round(Ye(th)) + .5); ctx.lineTo(M.l + pw, Math.round(Ye(th)) + .5); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = "#e5534b"; ctx.fillText(th.toFixed(2), M.l + pw + 6, Ye(th));
  ctx.fillStyle = "#d7dce2"; ctx.textBaseline = "top"; ctx.fillText(`日足 Efficiency Ratio(${erPer()})  前日確定　緑=しきい値以上`, M.l + 6, y0 + 3);
}

/* ---------- トレード表示（TR があるときだけ） ---------- */
const fmtP = p => p == null ? "-" : (+p).toFixed(dec);
function bgMode() {
  if (DLIVE && d.lf && $("bg").value === "live") return "live";
  if (TR && d.fs && $("bg").value === "filter") return "filter";
  if (TR && d.ut && $("bg").value === "used") return "used";
  return "tf";
}
function bgTrend() {
  const m = bgMode();
  if (m === "live") return d.lf;
  if (m === "filter") return d.fs.map(v => v === 1 || v === -1 ? v : 0);
  if (m === "used") return d.ut.map(v => v ?? 0);
  return res.trend;
}
function tradeIdx(t) { return t.idx[$("tf").value]; }
function tradeText(t) {
  const lv = DLIVE && t.dp >= 0 ? `\nフィルター（ER${$("erp").value}≥${(+$("erth").value).toFixed(2)}）: ${t.ok ? "通過" : "除外"}  エントリー時の日足ER ${live.er[t.dp] == null ? "-" : live.er[t.dp].toFixed(2)}` : "";
  const r = t.pnl / TR.risk, nm = v => v === 1 ? "上昇" : v === -1 ? "下降" : "レンジ";
  return `── トレード（${t.d > 0 ? "買い" : "売り"}${DATA["4H"].ut ? " / 週足 " + nm(t.wk) : ""}）──\n` +
    `エントリー ${t.et}  @ ${fmtP(t.ep)}\n決済       ${t.xt}  @ ${fmtP(t.xp)}\n` +
    `SL ${fmtP(t.sl)}  TP ${fmtP(t.tp)}  枚数 ${Math.abs(t.size).toLocaleString()}\n` +
    `損益 ${t.pnl.toFixed(2)}（${r >= 0 ? "+" : ""}${r.toFixed(2)}R） ${t.reason}` + lv;
}
function tradeAt(i, my, Y) {
  // カーソルの足を含むトレードのうち、エントリー価格〜決済価格が縦方向に一番近いもの
  let best = null, bd = Infinity;
  for (const t of TR.trades) {
    const [ei, xi] = tradeIdx(t);
    if (ei < 0 || i < ei - 1 || i > Math.max(ei, xi) + 1 || !visT(t)) continue;
    const ya = Y(t.ep), yb = Y(t.xp), dist = my < Math.min(ya, yb) ? Math.min(ya, yb) - my : my > Math.max(ya, yb) ? my - Math.max(ya, yb) : 0;
    if (dist < bd) { bd = dist; best = t; }
  }
  return bd < 40 ? best : null;
}
function drawTrades(i0, i1, X, Y, bw) {
  // エントリーライン（4時間足 Swing High/Low。1本前の判定足までの確定情報＝バックテストと同じ値）
  if (d.esh && $("eln").checked) {
    for (const [arr, val, col] of [[d.esh, d.eshv, "201,162,39"], [d.esl, d.eslv, "91,143,217"]]) {
      ctx.lineWidth = 1.5;
      for (let i = i0; i <= i1; i++) {
        if (arr[i] == null) continue;
        ctx.strokeStyle = `rgba(${col},${val[i] ? .85 : .25})`;
        const y = Y(arr[i]); ctx.beginPath(); ctx.moveTo(X(i) - bw / 2, y); ctx.lineTo(X(i) + bw / 2, y); ctx.stroke();
      }
    }
  }
  if (!$("trd").checked) return;
  const s = Math.max(5, Math.min(9, bw * 0.7 + 3));
  for (const t of TR.trades) {
    const [ei, xi] = tradeIdx(t);
    if (ei < 0 || xi < i0 - 1 || ei > i1 + 1 || !visT(t)) continue;
    ctx.globalAlpha = !DLIVE || t.ok ? 1 : .3;
    const win = t.pnl > 0, col = win ? "#2bd17e" : "#ff5a52";
    const xe = X(ei), xx = X(xi), ye = Y(t.ep), yx = Y(t.xp);
    // SL / TP（エントリーから決済まで）
    ctx.setLineDash([2, 3]); ctx.lineWidth = 1;
    if (t.tp != null) { ctx.strokeStyle = "rgba(43,209,126,.7)"; ctx.beginPath(); ctx.moveTo(xe, Y(t.tp)); ctx.lineTo(xx, Y(t.tp)); ctx.stroke(); }
    if (t.sl != null) { ctx.strokeStyle = "rgba(255,90,82,.7)"; ctx.beginPath(); ctx.moveTo(xe, Y(t.sl)); ctx.lineTo(xx, Y(t.sl)); ctx.stroke(); }
    // エントリー → 決済
    ctx.setLineDash([5, 3]); ctx.lineWidth = 2; ctx.strokeStyle = col;
    ctx.beginPath(); ctx.moveTo(xe, ye); ctx.lineTo(xx, yx); ctx.stroke(); ctx.setLineDash([]);
    // エントリー（▲買い / ▼売り）
    ctx.fillStyle = t.d > 0 ? "#b18cff" : "#ff6fd1"; ctx.strokeStyle = "#fff"; ctx.lineWidth = 1;
    ctx.beginPath();
    if (t.d > 0) { ctx.moveTo(xe, ye); ctx.lineTo(xe - s, ye + s * 1.5); ctx.lineTo(xe + s, ye + s * 1.5); }
    else { ctx.moveTo(xe, ye); ctx.lineTo(xe - s, ye - s * 1.5); ctx.lineTo(xe + s, ye - s * 1.5); }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // 決済
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(xx, yx, s * 0.6, 0, 6.3); ctx.fill(); ctx.stroke();
    ctx.globalAlpha = 1;
  }
}
let cur = -1;
function gotoTrade(step) {
  if (!TR || !TR.trades.length) return;
  const mid = (view.from + view.to) / 2;
  if (cur < 0) {  // 表示中の中央より後ろ（前）で一番近いトレードから
    const list = TR.trades.map((t, k) => [tradeIdx(t)[0], k]).filter(([e, k]) => e >= 0 && visT(TR.trades[k]));
    const c = step > 0 ? list.find(([e]) => e > mid) : [...list].reverse().find(([e]) => e < mid);
    cur = c ? c[1] : (step > 0 ? 0 : TR.trades.length - 1);
  } else cur = Math.max(0, Math.min(TR.trades.length - 1, cur + step));
  const [ei, xi] = tradeIdx(TR.trades[cur]);
  const span = Math.max(60, Math.min(400, (xi - ei) * 4 + 40));
  const c = (ei + xi) / 2; view = { from: c - span / 2, to: c + span / 2 }; mouse = null; draw();
}

/* ---------- 操作 ---------- */
cv.addEventListener("wheel", e => {
  e.preventDefault();
  const pw = W - M.l - M.r, span = view.to - view.from, r = cv.getBoundingClientRect();
  const anchor = view.from + (e.clientX - r.left - M.l) / pw * span;
  if (e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)) { const dx = (e.deltaX || e.deltaY) / pw * span; view = { from: view.from + dx, to: view.to + dx }; }
  else { const k = Math.exp(e.deltaY * 0.0015), ns = span * k; const f = (anchor - view.from) / span; view = { from: anchor - f * ns, to: anchor + (1 - f) * ns }; }
  draw();
}, { passive: false });
cv.addEventListener("mousedown", e => { drag = { x: e.clientX, from: view.from, to: view.to }; });
window.addEventListener("mouseup", () => drag = null);
window.addEventListener("mousemove", e => {
  const r = cv.getBoundingClientRect(); mouse = { x: e.clientX - r.left, y: e.clientY - r.top };
  if (drag) { const pw = W - M.l - M.r, dx = (e.clientX - drag.x) / pw * (drag.to - drag.from); view = { from: drag.from - dx, to: drag.to - dx }; }
  draw();
});
cv.addEventListener("mouseleave", () => { mouse = null; draw(); });
// タッチ（1本指で移動、2本指でピンチ）
let tch = null;
cv.addEventListener("touchstart", e => { tch = { n: e.touches.length, x: e.touches[0].clientX, dist: e.touches.length > 1 ? Math.abs(e.touches[0].clientX - e.touches[1].clientX) : 0, v: { ...view } }; }, { passive: true });
cv.addEventListener("touchmove", e => {
  if (!tch) return; e.preventDefault();
  const pw = W - M.l - M.r, span = tch.v.to - tch.v.from;
  if (e.touches.length > 1 && tch.dist) {
    const k = tch.dist / Math.abs(e.touches[0].clientX - e.touches[1].clientX), c = (tch.v.from + tch.v.to) / 2;
    view = { from: c - span * k / 2, to: c + span * k / 2 };
  } else { const dx = (e.touches[0].clientX - tch.x) / pw * span; view = { from: tch.v.from - dx, to: tch.v.to - dx }; }
  draw();
}, { passive: false });
let timer = null;
for (const id of ["n", "ap", "ma", "tf"]) $(id).addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(recompute, 30); });
for (const id of ["wick"]) $(id).addEventListener("change", recompute);
for (const id of ["shade", "zig", "conf", "smaon", "dma", "der"]) $(id).addEventListener("change", draw);
$("maper").addEventListener("change", draw);
if (DLIVE) {
  $("livectl").style.display = "inline-flex"; $("erp").value = DAILY.er; $("erth").value = DAILY.th;
  for (const id of ["erp", "erth"]) $(id).addEventListener("input", () => { applyLive(); draw(); });
  $("exc").addEventListener("change", draw);
}
if (!DATA["1H"]) { for (const o of $("tf").options) if (o.value === "1H") o.remove(); }
if (DAILY) { if (DAILY.ma) $("dmal").style.display = "flex"; if (DAILY.er) $("derl").style.display = "flex"; }
$("reset").onclick = resetView;
if (TR) {
  $("trctl").style.display = "inline-flex";
  if (!DATA["4H"].ut) { $("bg").value = "tf"; $("bg").options[0].disabled = true; }  // 週足トレンドを使わない戦略
  if (DLIVE) $("bg").value = "live"; else if (DATA["4H"].fs) $("bg").value = "filter"; else $("bg").value = $("bg").value;
  if (!DATA["4H"].fs) $("bg").options[2].disabled = true;
  if (!DLIVE) $("bg").options[3].disabled = true;  // 方向フィルターを使った検証
  for (const id of ["trd", "eln", "bg"]) $(id).addEventListener("change", draw);
  $("prev").onclick = () => gotoTrade(-1); $("next").onclick = () => gotoTrade(1);
  window.addEventListener("keydown", e => { if (e.key === "ArrowRight") gotoTrade(1); else if (e.key === "ArrowLeft") gotoTrade(-1); });
}
$("jump").addEventListener("change", e => {
  const s = Date.parse(e.target.value + "T00:00:00Z") / 1000; if (isNaN(s)) return;
  let lo = 0, hi = d.t.length - 1; while (lo < hi) { const m = (lo + hi) >> 1; if (d.t[m] < s) lo = m + 1; else hi = m; }
  const span = Math.min(view.to - view.from, 300); view = { from: lo - span * 0.1, to: lo + span * 0.9 }; draw();
});
window.addEventListener("resize", resize);
function setMin(on) {
  $("ctl").classList.toggle("min", on); $("ctltog").textContent = on ? "設定 ▾" : "設定 ▴";
  try { localStorage.setItem("dowCtlMin", on ? "1" : "0"); } catch (e) {}
  resize();
}
$("det").addEventListener("change", draw);
$("ctltog").onclick = () => setMin(!$("ctl").classList.contains("min"));
$("leg").addEventListener("change", () => { try { localStorage.setItem("dowLegend", $("leg").checked ? "1" : "0"); } catch (e) {} draw(); });
{ let m = null, lg = null; try { m = localStorage.getItem("dowCtlMin"); lg = localStorage.getItem("dowLegend"); } catch (e) {}
  const small = window.innerWidth < 1000 || window.innerHeight < 640;
  if (lg !== null ? lg === "0" : small) $("leg").checked = false;
  if (m !== null ? m === "1" : small) $("ctl").classList.add("min"), $("ctltog").textContent = "設定 ▾"; }

d = DATA["4H"]; res = null;
resize(); recompute();
view = { from: d.t.length - 300, to: d.t.length + 10 }; recompute();
window.__dow = { computeDow, DATA }; // 検証用
</script>
